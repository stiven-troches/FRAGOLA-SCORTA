services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SCORTA_OWNER_COMPANY: ${SCORTA_OWNER_COMPANY:-Fragola}
      SCORTA_OWNER_USER: ${SCORTA_OWNER_USER:-Steven}
      SCORTA_OWNER_NAME: ${SCORTA_OWNER_NAME:-Steven}
      SCORTA_OWNER_EMAIL: ${SCORTA_OWNER_EMAIL:-}
      SCORTA_OWNER_PASSWORD: ${SCORTA_OWNER_PASSWORD:?Define la contraseña del propietario de al menos 8 caracteres con número, mayúscula, minúscula y símbolo}
      SCORTA_OWNER_CONTACT: ${SCORTA_OWNER_CONTACT:-Contacta al propietario de SCORTA para renovar tu acceso}
      SCORTA_PUBLIC_URL: https://${DOMAIN:?Define el dominio}
    volumes:
      - inventory:/data
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define el dominio}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
volumes:
  inventory:
  certificates:

