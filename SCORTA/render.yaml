# Render Blueprint de SCORTA (OPS-05, OPS-08, OPS-09).
# Sintaxis verificada contra https://render.com/docs/blueprint-spec (noviembre 2026).
#
# IMPORTANTE: Render busca el Blueprint en la RAÍZ del repositorio. Este archivo vive en SCORTA/,
# así que al crear el Blueprint en el Dashboard indica la ruta "SCORTA/render.yaml"
# (New > Blueprint > "Blueprint Path"). rootDir de cada servicio se resuelve desde la raíz del repo.
#
# Costos de referencia (precios públicos de Render, pueden cambiar):
#   - plan starter (0.5c-512mb): ~7 USD/mes por servicio.
#   - disco persistente: ~0.25 USD por GB al mes (1 GB = ~0.25 USD).
#   Producción + staging ≈ 14.5 USD/mes. El plan "free" NO admite discos persistentes,
#   por eso staging usa también el plan pago más barato. Mantener staging es DECISIÓN DEL DUEÑO:
#   si no lo quieres, borra el segundo servicio antes de sincronizar el Blueprint.

services:
  # ---------------------------------------------------------------- PRODUCCIÓN
  - type: web
    name: scorta                     # Nombre del servicio (y del subdominio scorta.onrender.com si está libre).
    runtime: node                    # Runtime nativo de Node; la versión la fija NODE_VERSION.
    rootDir: SCORTA                  # La app vive en la subcarpeta SCORTA del repositorio.
    branch: main                     # Solo se despliega la rama protegida main.
    region: ohio                     # Región de EE. UU. más cercana a Colombia con buena latencia.
    plan: starter                    # 0.5 CPU / 512 MB. Equivale a "0.5c-512mb". Pago: necesario para el disco.
    numInstances: 1                  # Con disco persistente Render solo permite 1 instancia (ver OPS-18).
    buildCommand: npm ci --include=dev && npm run build   # Instala el lockfile completo (Vite es devDependency y NODE_ENV=production las omitiría) y compila el frontend.
    startCommand: npm start          # node --env-file-if-exists=.env server.mjs
    healthCheckPath: /healthz        # 200 {"ok":true} si la base responde; Render no enruta tráfico hasta que pase.
    autoDeployTrigger: checksPass    # Despliega cada commit de main SOLO si los checks de GitHub (CI) pasan.
                                     # Reemplaza al antiguo "autoDeploy: true".
    maxShutdownDelaySeconds: 30      # Tiempo para cerrar SQLite limpiamente tras SIGTERM.
    disk:
      name: scorta-data              # Disco persistente: bases SQLite (y DATA_DIR/media si no hay R2 para imágenes).
      mountPath: /var/data           # Debe coincidir con DATA_DIR.
      sizeGB: 1                      # Se puede aumentar después, nunca reducir.
    envVars:
      - key: NODE_ENV
        value: production            # Activa cookies Secure, HSTS y la validación estricta del arranque.
      - key: HOST
        value: 0.0.0.0               # Escuchar en todas las interfaces (Render enruta desde fuera del contenedor).
      - key: DATA_DIR
        value: /var/data             # Carpeta de las bases SQLite = punto de montaje del disco.
      - key: NODE_VERSION
        value: "24"                  # Render instala la última versión de Node 24 (coincide con engines).
      - key: SCORTA_TEST_COMPANY
        value: "0"                   # Sin empresa ficticia: sus credenciales son públicas (docs/EMPRESA-DE-PRUEBA.md).
      - key: SCORTA_HEALTH_TOKEN
        generateValue: true          # Token para ver el detalle de /healthz (Authorization: Bearer ...).
      # --- Valores que se piden en el Dashboard al crear el Blueprint (sync:false = nunca en git) ---
      - key: SCORTA_PUBLIC_URL
        sync: false                  # URL pública canónica, p. ej. https://app.scorta.co (enlaces y CSRF).
      - key: SCORTA_OWNER_COMPANY
        sync: false                  # Empresa del propietario de la plataforma.
      - key: SCORTA_OWNER_USER
        sync: false                  # Usuario del propietario.
      - key: SCORTA_OWNER_NAME
        sync: false                  # Nombre visible del propietario.
      - key: SCORTA_OWNER_EMAIL
        sync: false                  # Correo del propietario.
      - key: SCORTA_OWNER_PASSWORD
        sync: false                  # SECRETO. Contraseña inicial del propietario (8+ caracteres, número, mayúscula, minúscula, símbolo).
      - key: SCORTA_OWNER_CONTACT
        sync: false                  # Texto de contacto que ven los clientes para renovar.
      - key: SCORTA_CLIENT_IP_HEADER
        sync: false                  # Cabecera con la IP real del cliente detrás del proxy de Render (p. ej. x-forwarded-for, o cf-connecting-ip con Cloudflare).
      - key: SCORTA_BACKUP_KEY
        sync: false                  # SECRETO. Llave de cifrado de los respaldos externos (OPS-01). Guárdala también fuera de Render.
      - key: SCORTA_S3_ENDPOINT
        sync: false                  # Endpoint S3 compatible (R2/B2/S3) para respaldos.
      - key: SCORTA_S3_BUCKET
        sync: false                  # Bucket de respaldos (con versionado o bloqueo de objetos).
      - key: SCORTA_S3_REGION
        sync: false                  # Región del bucket (en R2 suele ser "auto").
      - key: SCORTA_S3_PREFIX
        sync: false                  # Prefijo (carpeta) dentro del bucket, p. ej. prod/.
      - key: SCORTA_S3_ACCESS_KEY_ID
        sync: false                  # SECRETO. Llave solo de escritura.
      - key: SCORTA_S3_SECRET_ACCESS_KEY
        sync: false                  # SECRETO.
      - key: SCORTA_BACKUP_PING_URL
        sync: false                  # URL de Healthchecks.io (dead-man's switch del respaldo, OPS-03).
      - key: SCORTA_MEDIA_S3_ENDPOINT
        sync: false                  # BE-30: endpoint S3 de R2 para fotos y logos. Vacío = DATA_DIR/media (respaldado con el respaldo externo).
      - key: SCORTA_MEDIA_S3_BUCKET
        sync: false                  # Bucket de imágenes, distinto al de respaldos y sin borrado por antigüedad.
      - key: SCORTA_MEDIA_S3_REGION
        sync: false                  # En R2 "auto" (valor por defecto si queda vacía).
      - key: SCORTA_MEDIA_S3_PREFIX
        sync: false                  # Opcional, p. ej. produccion.
      - key: SCORTA_MEDIA_S3_ACCESS_KEY_ID
        sync: false                  # SECRETO. Token de R2 con lectura y escritura solo en el bucket de imágenes.
      - key: SCORTA_MEDIA_S3_SECRET_ACCESS_KEY
        sync: false                  # SECRETO.
      - key: RESEND_API_KEY
        sync: false                  # SECRETO. Llave de Resend para correos de recuperación (SEG-13). Vacía = recuperación por correo apagada.
      - key: SCORTA_MAIL_FROM
        sync: false                  # Remitente verificado en Resend, p. ej. "SCORTA <no-responder@tudominio.com>".
      - key: SCORTA_MAIL_WEBHOOK_URL
        sync: false                  # Alternativa a Resend: webhook HTTPS propio que recibe {from,to,subject,text}.
      - key: SCORTA_MAIL_WEBHOOK_SECRET
        sync: false                  # SECRETO. Se envía como Authorization: Bearer al webhook.

  # ---------------------------------------------------------------- STAGING (OPS-09)
  # Copia de producción para probar antes de publicar. Datos propios y separados.
  # Costo adicional ≈ 7.25 USD/mes: decisión del dueño (ver cabecera).
  - type: web
    name: scorta-staging
    runtime: node
    rootDir: SCORTA
    branch: staging                  # Rama de pruebas: haz merge/push a "staging" para desplegar aquí primero.
                                     # La rama debe existir en GitHub ANTES de sincronizar el Blueprint:
                                     #   git push origin main:staging
    region: ohio
    plan: starter                    # El plan pago más barato; "free" no admite disco.
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass    # También espera a que el CI pase en la rama staging.
    disk:
      name: scorta-staging-data      # Disco propio: staging NUNCA comparte datos con producción.
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production            # Igual que producción para probar el mismo comportamiento.
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "24"
      - key: SCORTA_TEST_COMPANY
        value: "0"                   # Para probar Moto Central Demo aquí: "1" y además SCORTA_TEST_COMPANY_PRODUCTION="1".
      - key: SCORTA_HEALTH_TOKEN
        generateValue: true          # Token propio de staging para ver el detalle de /healthz.
      - key: SCORTA_PUBLIC_URL
        sync: false                  # p. ej. https://scorta-staging.onrender.com
      - key: SCORTA_OWNER_COMPANY
        sync: false
      - key: SCORTA_OWNER_USER
        sync: false
      - key: SCORTA_OWNER_NAME
        sync: false
      - key: SCORTA_OWNER_EMAIL
        sync: false
      - key: SCORTA_OWNER_PASSWORD
        sync: false                  # Usa una contraseña DISTINTA a la de producción.
      - key: SCORTA_OWNER_CONTACT
        sync: false
      - key: SCORTA_CLIENT_IP_HEADER
        sync: false
      - key: SCORTA_BACKUP_KEY
        sync: false                  # Llave distinta a producción (o deja vacío para no respaldar staging).
      - key: SCORTA_S3_ENDPOINT
        sync: false
      - key: SCORTA_S3_BUCKET
        sync: false                  # Bucket o prefijo distinto al de producción.
      - key: SCORTA_S3_REGION
        sync: false
      - key: SCORTA_S3_PREFIX
        sync: false                  # p. ej. staging/
      - key: SCORTA_S3_ACCESS_KEY_ID
        sync: false
      - key: SCORTA_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SCORTA_BACKUP_PING_URL
        sync: false
      - key: SCORTA_MEDIA_S3_ENDPOINT
        sync: false
      - key: SCORTA_MEDIA_S3_BUCKET
        sync: false                  # Bucket o prefijo distinto al de producción.
      - key: SCORTA_MEDIA_S3_REGION
        sync: false
      - key: SCORTA_MEDIA_S3_PREFIX
        sync: false                  # p. ej. staging
      - key: SCORTA_MEDIA_S3_ACCESS_KEY_ID
        sync: false
      - key: SCORTA_MEDIA_S3_SECRET_ACCESS_KEY
        sync: false
